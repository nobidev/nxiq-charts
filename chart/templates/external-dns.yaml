{{- if .Values.externalDns.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
rules:
- apiGroups: [""]
  resources: ["services","endpoints","pods","nodes"]
  verbs: ["get","watch","list"]
- apiGroups: ["extensions","networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get","watch","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns-viewer
  labels:
    app.kubernetes.io/name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
subjects:
  - kind: ServiceAccount
    name: {{ .Values.iq_server.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
  labels:
    app.kubernetes.io/name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
    spec:
      serviceAccountName: {{ .Values.iq_server.serviceAccountName }}
      automountServiceAccountToken: true
      containers:
        - name: {{ include "nexus-iq-server-ha.fullname" . }}-external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.13.1
          args:
            {{- range .Values.externalDns.args }}
            - {{ tpl . $ }}
            {{- end }}
{{- end }}
